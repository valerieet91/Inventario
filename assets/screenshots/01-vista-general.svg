<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="100%" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Fondo principal -->
  <rect width="1100" height="620" fill="#f1f5f9"/>

  <!-- Header -->
  <rect width="1100" height="76" fill="#0f172a"/>
  <text x="40" y="36" fill="#ffffff" font-size="22" font-weight="700">📦 Stockly</text>
  <text x="40" y="58" fill="#cbd5e1" font-size="13">Sistema de gestión de inventario para tienda y emprendimiento</text>
  <rect x="890" y="22" width="170" height="32" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="975" y="42" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Cargar datos de ejemplo</text>

  <!-- Stats Cards -->
  <g transform="translate(40, 96)">
    <rect x="0" y="0" width="240" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="4" height="74" rx="2" fill="#2563eb"/>
    <text x="18" y="26" fill="#64748b" font-size="11" font-weight="600">TOTAL DE PRODUCTOS</text>
    <text x="18" y="56" fill="#0f172a" font-size="24" font-weight="700">5</text>

    <rect x="260" y="0" width="240" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="260" y="0" width="4" height="74" rx="2" fill="#2563eb"/>
    <text x="278" y="26" fill="#64748b" font-size="11" font-weight="600">UNIDADES EN STOCK</text>
    <text x="278" y="56" fill="#0f172a" font-size="24" font-weight="700">52</text>

    <rect x="520" y="0" width="240" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="520" y="0" width="4" height="74" rx="2" fill="#2563eb"/>
    <text x="538" y="26" fill="#64748b" font-size="11" font-weight="600">VALOR TOTAL DEL INVENTARIO</text>
    <text x="538" y="56" fill="#0f172a" font-size="24" font-weight="700">$1,300.50</text>

    <rect x="780" y="0" width="240" height="74" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="780" y="0" width="4" height="74" rx="2" fill="#d97706"/>
    <text x="798" y="26" fill="#64748b" font-size="11" font-weight="600">ALERTAS DE STOCK BAJO (≤ 5)</text>
    <text x="798" y="56" fill="#0f172a" font-size="24" font-weight="700">2</text>
  </g>

  <!-- Formulario Izquierdo (Create) -->
  <g transform="translate(40, 190)">
    <rect width="310" height="395" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" fill="#0f172a" font-size="16" font-weight="700">Nuevo Producto</text>
    <rect x="205" y="17" width="85" height="22" rx="11" fill="#dbeafe"/>
    <text x="247" y="32" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle">Modo: Crear</text>
    <line x1="20" y1="50" x2="290" y2="50" stroke="#e2e8f0"/>

    <text x="20" y="74" fill="#334155" font-size="12" font-weight="600">Código / SKU *</text>
    <rect x="20" y="82" width="270" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="103" fill="#94a3b8" font-size="12">Ej: PROD-001</text>

    <text x="20" y="138" fill="#334155" font-size="12" font-weight="600">Nombre del producto *</text>
    <rect x="20" y="146" width="270" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="167" fill="#94a3b8" font-size="12">Ej: Audífonos Inalámbricos</text>

    <text x="20" y="202" fill="#334155" font-size="12" font-weight="600">Categoría *</text>
    <rect x="20" y="210" width="270" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="231" fill="#0f172a" font-size="12">Selecciona una categoría...</text>

    <text x="20" y="266" fill="#334155" font-size="12" font-weight="600">Precio unitario ($) *</text>
    <rect x="20" y="274" width="128" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="295" fill="#94a3b8" font-size="12">0.00</text>

    <text x="162" y="266" fill="#334155" font-size="12" font-weight="600">Stock disponible *</text>
    <rect x="162" y="274" width="128" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="174" y="295" fill="#94a3b8" font-size="12">0</text>

    <rect x="20" y="330" width="270" height="38" rx="6" fill="#2563eb"/>
    <text x="155" y="354" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Guardar Producto</text>
  </g>

  <!-- Tabla Derecha (Read) -->
  <g transform="translate(370, 190)">
    <rect width="690" height="395" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="20" y="34" fill="#0f172a" font-size="16" font-weight="700">Listado de Inventario</text>
    <rect x="330" y="14" width="180" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="342" y="33" fill="#94a3b8" font-size="11">Buscar por nombre o código...</text>
    <rect x="520" y="14" width="150" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="532" y="33" fill="#0f172a" font-size="11">Todas las categorías</text>
    <line x1="20" y1="54" x2="670" y2="54" stroke="#e2e8f0"/>

    <!-- Encabezado tabla -->
    <rect x="20" y="64" width="650" height="32" fill="#f8fafc"/>
    <text x="30" y="84" fill="#475569" font-size="11" font-weight="700">CÓDIGO</text>
    <text x="115" y="84" fill="#475569" font-size="11" font-weight="700">PRODUCTO</text>
    <text x="310" y="84" fill="#475569" font-size="11" font-weight="700">CATEGORÍA</text>
    <text x="400" y="84" fill="#475569" font-size="11" font-weight="700">PRECIO</text>
    <text x="465" y="84" fill="#475569" font-size="11" font-weight="700">STOCK</text>
    <text x="595" y="84" fill="#475569" font-size="11" font-weight="700">ACCIONES</text>

    <!-- Fila 1 -->
    <line x1="20" y1="142" x2="670" y2="142" stroke="#e2e8f0"/>
    <rect x="28" y="109" width="64" height="22" rx="4" fill="#f1f5f9"/>
    <text x="60" y="124" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">ELEC-101</text>
    <text x="115" y="124" fill="#0f172a" font-size="12" font-weight="600">Teclado Mecánico RGB Compacto</text>
    <text x="310" y="124" fill="#334155" font-size="12">Electrónica</text>
    <text x="400" y="124" fill="#334155" font-size="12">$45.00</text>
    <rect x="465" y="109" width="105" height="22" rx="11" fill="#dcfce7"/>
    <text x="517" y="124" fill="#166534" font-size="10" font-weight="600" text-anchor="middle">14 uds • Disponible</text>
    <rect x="582" y="108" width="42" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="603" y="124" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">Editar</text>
    <rect x="628" y="108" width="42" height="24" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="649" y="124" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">Borrar</text>

    <!-- Fila 2 -->
    <line x1="20" y1="190" x2="670" y2="190" stroke="#e2e8f0"/>
    <rect x="28" y="157" width="64" height="22" rx="4" fill="#f1f5f9"/>
    <text x="60" y="172" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">ACC-204</text>
    <text x="115" y="172" fill="#0f172a" font-size="12" font-weight="600">Soporte Ajustable de Aluminio</text>
    <text x="310" y="172" fill="#334155" font-size="12">Accesorios</text>
    <text x="400" y="172" fill="#334155" font-size="12">$22.50</text>
    <rect x="465" y="157" width="105" height="22" rx="11" fill="#fef3c7"/>
    <text x="517" y="172" fill="#92400e" font-size="10" font-weight="600" text-anchor="middle">4 uds • Stock bajo</text>
    <rect x="582" y="156" width="42" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="603" y="172" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">Editar</text>
    <rect x="628" y="156" width="42" height="24" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="649" y="172" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">Borrar</text>

    <!-- Fila 3 -->
    <line x1="20" y1="238" x2="670" y2="238" stroke="#e2e8f0"/>
    <rect x="28" y="205" width="64" height="22" rx="4" fill="#f1f5f9"/>
    <text x="60" y="220" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">HOG-302</text>
    <text x="115" y="220" fill="#0f172a" font-size="12" font-weight="600">Lámpara LED de Escritorio</text>
    <text x="310" y="220" fill="#334155" font-size="12">Hogar</text>
    <text x="400" y="220" fill="#334155" font-size="12">$15.75</text>
    <rect x="465" y="205" width="105" height="22" rx="11" fill="#fee2e2"/>
    <text x="517" y="220" fill="#991b1b" font-size="10" font-weight="600" text-anchor="middle">0 uds • Agotado</text>
    <rect x="582" y="204" width="42" height="24" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="603" y="220" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">Editar</text>
    <rect x="628" y="204" width="42" height="24" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="649" y="220" fill="#dc2626" font-size="10" font-weight="600" text-anchor="middle">Borrar</text>
  </g>
</svg>
